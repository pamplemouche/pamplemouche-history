<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pamplemouche History</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #080b10;
    color: #e8edf5;
}

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =========================================================
   CARTE
========================================================= */

#map {
    position: absolute;

    inset: 0;

    background: #080b10;
}

#map svg {
    width: 100%;
    height: 100%;
}


/* Pays */

.country {
    stroke: #161c25;
    stroke-width: 0.65px;

    transition:
        filter 0.12s ease,
        stroke-width 0.12s ease;
}

.country:hover {
    filter: brightness(1.25);

    cursor: pointer;

    stroke: #ffffff;
    stroke-width: 1px;
}

.country.selected {
    stroke: #ffffff;
    stroke-width: 1.5px;

    filter: brightness(1.2);
}


/* Noms des pays */

.country-label {
    pointer-events: none;

    fill: #ffffff;

    font-size: 8px;

    font-weight: 600;

    text-anchor: middle;

    paint-order: stroke;

    stroke: rgba(0, 0, 0, 0.75);
    stroke-width: 2.5px;
    stroke-linejoin: round;

    user-select: none;
}


/*
   Les très petits pays ont besoin d'un texte plus petit.
*/

.country-label.small {
    font-size: 6px;
}


/* =========================================================
   BOUTONS
========================================================= */

#bottomControls {

    position: absolute;

    left: 18px;
    bottom: 18px;

    display: flex;

    gap: 8px;

    z-index: 20;
}


.controlButton {

    border: 1px solid #394452;

    background:
        rgba(15, 19, 26, 0.92);

    color: #e8edf5;

    padding: 10px 14px;

    border-radius: 9px;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}


.controlButton:hover {

    background:
        rgba(30, 38, 50, 0.96);

    border-color: #59677a;
}


/* =========================================================
   TEMPS
========================================================= */

#timeContainer {

    position: absolute;

    top: 18px;
    right: 18px;

    z-index: 30;
}


#timeButton {

    border: 1px solid #394452;

    background:
        rgba(15, 19, 26, 0.92);

    color: #e8edf5;

    padding: 10px 14px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    backdrop-filter: blur(10px);
}


#timeButton:hover {

    background:
        rgba(30, 38, 50, 0.96);
}


#timeMenu {

    position: absolute;

    top: calc(100% + 7px);
    right: 0;

    width: 170px;

    padding: 6px;

    border: 1px solid #394452;

    border-radius: 9px;

    background:
        rgba(13, 17, 23, 0.98);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.45);

    display: none;
}


#timeMenu.open {
    display: block;
}


.timeOption {

    width: 100%;

    border: none;

    background: transparent;

    color: #dce3ed;

    text-align: left;

    padding: 9px 10px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;
}


.timeOption:hover {

    background: #202936;
}


.timeSeparator {

    height: 1px;

    background: #2c3542;

    margin: 5px 0;
}


/* =========================================================
   PANNEAU IA
========================================================= */

#aiPanel {

    position: absolute;

    left: 18px;
    top: 18px;

    width:
        min(390px, calc(100vw - 36px));

    height:
        min(500px, calc(100vh - 36px));

    display: none;

    flex-direction: column;

    background:
        rgba(12, 16, 22, 0.97);

    border: 1px solid #394452;

    border-radius: 11px;

    box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.55);

    backdrop-filter: blur(14px);

    z-index: 50;

    overflow: hidden;
}


#aiPanel.open {
    display: flex;
}


/* Header */

#aiHeader {

    height: 43px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    background: #151b24;

    border-bottom:
        1px solid #2b3441;
}


#aiTitle {

    font-size: 13px;

    font-weight: 600;
}


#closeAi {

    border: none;

    background: transparent;

    color: #8e9bab;

    font-size: 20px;

    cursor: pointer;

    line-height: 1;
}


#closeAi:hover {
    color: white;
}


/* =========================================================
   MESSAGES
========================================================= */

#messages {

    flex: 1;

    overflow-y: auto;

    padding: 12px;
}


.message {

    max-width: 88%;

    padding: 8px 10px;

    margin-bottom: 8px;

    border-radius: 8px;

    font-size: 13px;

    line-height: 1.45;

    white-space: pre-wrap;
}


.message.ai {

    background: #1b2430;

    color: #dce6f3;
}


.message.user {

    margin-left: auto;

    background: #31598c;

    color: white;
}


/* =========================================================
   ACTIONS
========================================================= */

#actionsList {

    display: none;

    flex: 1;

    overflow-y: auto;

    padding: 12px;
}


.actionItem {

    padding: 10px;

    margin-bottom: 7px;

    background: #151c25;

    border: 1px solid #293341;

    border-radius: 8px;

    font-size: 13px;
}


.actionNumber {

    color: #91a8c7;

    margin-right: 5px;
}


.actionPending {

    display: block;

    margin-top: 5px;

    color: #6f7d8e;

    font-size: 11px;
}


.emptyActions {

    color: #687687;

    font-size: 13px;

    line-height: 1.5;

    padding: 5px;
}


/* =========================================================
   INPUT
========================================================= */

#inputArea {

    display: flex;

    gap: 7px;

    padding: 8px;

    background: #10151d;

    border-top:
        1px solid #2b3441;
}


#messageInput {

    flex: 1;

    min-width: 0;

    border: 1px solid #323d4b;

    border-radius: 7px;

    padding: 9px 10px;

    outline: none;

    background: #090d12;

    color: white;

    font-family: inherit;

    font-size: 13px;
}


#messageInput:focus {

    border-color: #536b91;
}


#sendButton {

    width: 40px;

    border: none;

    border-radius: 7px;

    background: #31598c;

    color: white;

    cursor: pointer;

    font-size: 15px;
}


#sendButton:hover {

    background: #3c6ba5;
}


/* =========================================================
   INFORMATIONS PAYS
========================================================= */

#countryPanel {

    position: absolute;

    right: 18px;
    bottom: 18px;

    width: 235px;

    padding: 13px;

    background:
        rgba(13, 18, 25, 0.92);

    border: 1px solid #303b49;

    border-radius: 10px;

    display: none;

    z-index: 15;

    backdrop-filter: blur(10px);
}


#countryPanel.visible {
    display: block;
}


#countryName {

    font-size: 15px;

    font-weight: 600;

    margin-bottom: 9px;
}


.countryInfo {

    font-size: 12px;

    color: #8795a7;

    margin-top: 5px;
}


/* =========================================================
   CUSTOM TIME
========================================================= */

#customOverlay {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 0, 0, 0.35);

    z-index: 100;
}


#customOverlay.open {
    display: flex;
}


#customBox {

    width:
        min(340px, calc(100vw - 36px));

    background: #121821;

    border: 1px solid #394452;

    border-radius: 11px;

    padding: 16px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6);
}


#customTitle {

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 14px;
}


#customInputs {

    display: flex;

    gap: 8px;
}


#customAmount,
#customUnit {

    flex: 1;

    min-width: 0;

    padding: 9px;

    border: 1px solid #354151;

    border-radius: 7px;

    background: #090d12;

    color: white;

    outline: none;
}


#customButtons {

    display: flex;

    justify-content: flex-end;

    gap: 7px;

    margin-top: 14px;
}


.customButton {

    border: 1px solid #394452;

    background: #1a222d;

    color: #e2e8f0;

    padding: 8px 12px;

    border-radius: 7px;

    cursor: pointer;
}


.customButton.primary {

    background: #31598c;

    border-color: #31598c;
}


/* =========================================================
   DATE
========================================================= */

#dateDisplay {

    position: absolute;

    top: 19px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 7px 11px;

    border-radius: 7px;

    background:
        rgba(10, 14, 20, 0.72);

    color: #b7c1cf;

    font-size: 12px;

    pointer-events: none;

    backdrop-filter: blur(8px);
}

</style>
</head>


<body>

<div id="game">


<!-- ======================================================
     CARTE
====================================================== -->

<div id="map">

    <svg id="worldMap"></svg>

</div>


<!-- ======================================================
     DATE
====================================================== -->

<div id="dateDisplay">
    1 janvier 1936
</div>


<!-- ======================================================
     TEMPS
====================================================== -->

<div id="timeContainer">

    <button id="timeButton">
        ⏱ Temps
    </button>


    <div id="timeMenu">

        <button
            class="timeOption"
            onclick="advanceTime(1, 'weeks')">

            1 semaine

        </button>


        <button
            class="timeOption"
            onclick="advanceTime(1, 'months')">

            1 mois

        </button>


        <button
            class="timeOption"
            onclick="advanceTime(1, 'years')">

            1 an

        </button>


        <div class="timeSeparator"></div>


        <button
            class="timeOption"
            onclick="openCustomTime()">

            Custom Time

        </button>

    </div>

</div>


<!-- ======================================================
     INFORMATIONS PAYS
====================================================== -->

<div id="countryPanel">

    <div id="countryName">
        Pays
    </div>

    <div class="countryInfo">
        Cliquez sur un pays pour voir ses informations.
    </div>

</div>


<!-- ======================================================
     PANNEAU IA
====================================================== -->

<div id="aiPanel">

    <div id="aiHeader">

        <div id="aiTitle">
            💬 Discussion
        </div>


        <button id="closeAi">
            ×
        </button>

    </div>


    <div id="messages"></div>


    <div id="actionsList"></div>


    <div id="inputArea">

        <input
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Écrivez un message..."
        >


        <button id="sendButton">
            ➤
        </button>

    </div>

</div>


<!-- ======================================================
     BOUTONS
====================================================== -->

<div id="bottomControls">

    <button
        class="controlButton"
        id="actionButton">

        ⚔ Action

    </button>


    <button
        class="controlButton"
        id="discussionButton">

        💬 Discussion

    </button>

</div>


<!-- ======================================================
     CUSTOM TIME
====================================================== -->

<div id="customOverlay">

    <div id="customBox">

        <div id="customTitle">
            ⏩ Temps personnalisé
        </div>


        <div id="customInputs">

            <input
                id="customAmount"
                type="number"
                min="1"
                value="3"
            >


            <select id="customUnit">

                <option value="days">
                    jours
                </option>

                <option value="weeks">
                    semaines
                </option>

                <option value="months">
                    mois
                </option>

                <option value="years">
                    années
                </option>

            </select>

        </div>


        <div id="customButtons">

            <button
                class="customButton"
                onclick="closeCustomTime()">

                Annuler

            </button>


            <button
                class="customButton primary"
                onclick="confirmCustomTime()">

                Continuer

            </button>

        </div>

    </div>

</div>


</div>


<script>

/* =========================================================
   ÉTAT DU JEU
========================================================= */


/*
    Date actuelle de la partie.
*/

let currentDate =
    new Date(1936, 0, 1);


/*
    Pays actuellement sélectionné.
*/

let selectedCountry = null;


/*
    Élément SVG sélectionné.
*/

let selectedCountryElement = null;


/*
    Mode du panneau IA.

    "discussion"
    ou
    "actions"
*/

let panelMode = "discussion";


/*
    Liste des actions en attente.

    IMPORTANT :

    Rien n'est envoyé à l'IA ici.

    Les actions sont seulement stockées.
*/

let pendingActions = [];


/*
    Groupe contenant les territoires
    de la carte.
*/

let mapGroup;


/*
    Liste des territoires.

    Chaque territoire possède :

        id
        name
        owner
        geometry
*/

let territories = [];


/*
    État politique du monde.

    Pour le moment chaque territoire
    appartient à lui-même.

    Plus tard :

        worldState.Belgium.owner = "France"

    permettra à l'IA d'annexer
    automatiquement la Belgique.
*/

let worldState = {};


/*
    Couleurs des pays.

    Une couleur est attribuée à chaque
    propriétaire.
*/

const countryColors = {};


/* =========================================================
   COULEURS
========================================================= */

const palette = [

    "#c94c4c",
    "#4c82c9",
    "#55a86b",
    "#c98a45",
    "#8957b5",
    "#45a6a0",
    "#b85d8d",
    "#7b9a45",
    "#c26c35",
    "#596fc1",
    "#a65a5a",
    "#5b9b83",
    "#9b7a45",
    "#725ca8",
    "#4c8eaa",
    "#ad5971",
    "#6f9652",
    "#b36c4a",
    "#637db0",
    "#96704d"

];


let colorIndex = 0;


function getCountryColor(owner) {

    /*
        Si une couleur existe déjà,
        on la conserve.

        C'est important :

        un pays garde toujours sa couleur,
        même après plusieurs années.
    */

    if (countryColors[owner]) {

        return countryColors[owner];

    }


    /*
        Nouvelle couleur.
    */

    countryColors[owner] =
        palette[
            colorIndex %
            palette.length
        ];

    colorIndex++;


    return countryColors[owner];

}


/* =========================================================
   INITIALISATION
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        initializeMap();


        document
            .getElementById("timeButton")
            .addEventListener(
                "click",
                toggleTimeMenu
            );


        document
            .getElementById("actionButton")
            .addEventListener(
                "click",
                openActions
            );


        document
            .getElementById("discussionButton")
            .addEventListener(
                "click",
                openDiscussion
            );


        document
            .getElementById("closeAi")
            .addEventListener(
                "click",
                closeAiPanel
            );


        document
            .getElementById("sendButton")
            .addEventListener(
                "click",
                sendMessage
            );


        document
            .getElementById("messageInput")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        sendMessage();

                    }

                }
            );


        document.addEventListener(
            "click",
            event => {

                const container =
                    document.getElementById(
                        "timeContainer"
                    );


                if (
                    !container.contains(
                        event.target
                    )
                ) {

                    closeTimeMenu();

                }

            }
        );

    }
);


/* =========================================================
   CARTE
========================================================= */

function initializeMap() {

    const svg =
        d3.select("#worldMap");


    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    /*
        Projection mondiale.
    */

    const projection =
        d3.geoNaturalEarth1()
          .scale(width / 5.8)
          .translate([
              width / 2,
              height / 2
          ]);


    const path =
        d3.geoPath()
          .projection(projection);


    /*
        Groupe principal.

        Tout ce qui concerne la carte
        sera dedans.
    */

    mapGroup =
        svg.append("g");


    /*
        Zoom.

        La carte peut être déplacée
        et zoomée.
    */

    const zoom =
        d3.zoom()
          .scaleExtent([1, 10])
          .on(
              "zoom",
              event => {

                  mapGroup.attr(
                      "transform",
                      event.transform
                  );

              }
          );


    svg.call(zoom);


    /*
        Récupération des frontières mondiales.
    */

    d3.json(
        "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
    )
    .then(world => {

        const features =
            topojson.feature(
                world,
                world.objects.countries
            ).features;


        /*
            Création des territoires.
        */

        territories =
            features.map(
                (feature, index) => {

                    /*
                        Le fichier World Atlas
                        contient un identifiant numérique.

                        Les noms peuvent varier selon
                        la version des données.

                        On crée donc un nom de secours.
                    */

                    const name =
                        feature.properties.name ||
                        "Territoire " +
                        feature.id;


                    /*
                        Chaque territoire commence
                        indépendant de lui-même.

                        C'est notre état politique
                        initial.
                    */

                    worldState[name] = {

                        owner: name,

                        name: name,

                        id: feature.id

                    };


                    return {

                        id: feature.id,

                        name: name,

                        owner: name,

                        geometry: feature

                    };

                }
            );


        /*
            Dessin des pays.
        */

        mapGroup
            .selectAll(".country")
            .data(territories)
            .enter()
            .append("path")

            .attr(
                "class",
                "country"
            )

            .attr(
                "d",
                d => path(d.geometry)
            )

            .attr(
                "fill",
                d =>
                    getCountryColor(
                        d.owner
                    )
            )

            .on(
                "click",
                function(event, d) {

                    selectCountry(
                        this,
                        d
                    );

                }
            );


        /*
            Ajout des noms.

            Le centroïde permet de placer
            automatiquement le nom au milieu
            du territoire.
        */

        mapGroup
            .selectAll(".country-label")
            .data(territories)
            .enter()
            .append("text")

            .attr(
                "class",
                d => {

                    /*
                        Petits territoires :
                        texte légèrement plus petit.
                    */

                    const bounds =
                        path.bounds(
                            d.geometry
                        );


                    const width =
                        bounds[1][0] -
                        bounds[0][0];


                    if (width < 25) {

                        return "country-label small";

                    }


                    return "country-label";

                }
            )

            .attr(
                "x",
                d =>
                    path.centroid(
                        d.geometry
                    )[0]
            )

            .attr(
                "y",
                d =>
                    path.centroid(
                        d.geometry
                    )[1]
            )

            .text(
                d => d.name
            );

    });

}


/* =========================================================
   SÉLECTION D'UN PAYS
========================================================= */

function selectCountry(
    element,
    territory
) {

    /*
        Retire la sélection précédente.
    */

    if (
        selectedCountryElement
    ) {

        d3.select(
            selectedCountryElement
        )
        .classed(
            "selected",
            false
        );

    }


    /*
        Nouvelle sélection.
    */

    selectedCountryElement =
        element;


    d3.select(element)
        .classed(
            "selected",
            true
        );


    selectedCountry =
        territory.name;


    showCountry(
        territory.name,
        territory.owner
    );

}


/* =========================================================
   INFORMATIONS PAYS
========================================================= */

function showCountry(
    name,
    owner
) {

    const panel =
        document.getElementById(
            "countryPanel"
        );


    document
        .getElementById(
            "countryName"
        )
        .textContent =
            name;


    const info =
        panel.querySelector(
            ".countryInfo"
        );


    if (
        owner === name
    ) {

        info.textContent =
            "Territoire contrôlé par " +
            owner +
            ".";

    }

    else {

        info.textContent =
            "Territoire contrôlé par " +
            owner +
            ".";

    }


    panel.classList.add(
        "visible"
    );

}


/* =========================================================
   PANNEAU IA
========================================================= */

function openAiPanel(
    mode
) {

    panelMode =
        mode;


    const panel =
        document.getElementById(
            "aiPanel"
        );


    const title =
        document.getElementById(
            "aiTitle"
        );


    const messages =
        document.getElementById(
            "messages"
        );


    const actions =
        document.getElementById(
            "actionsList"
        );


    panel.classList.add(
        "open"
    );


    if (
        mode === "discussion"
    ) {

        title.textContent =
            "💬 Discussion";


        messages.style.display =
            "block";


        actions.style.display =
            "none";


        document
            .getElementById(
                "messageInput"
            )
            .placeholder =
                "Écrivez un message...";


        if (
            messages.children.length === 0
        ) {

            addAiMessage(
                "Je suis prêt. Posez-moi une question sur votre pays ou sur la situation du monde."
            );

        }

    }

    else {

        title.textContent =
            "⚔ Actions";


        messages.style.display =
            "none";


        actions.style.display =
            "block";


        document
            .getElementById(
                "messageInput"
            )
            .placeholder =
                "Décrivez une action...";


        renderActions();

    }


    document
        .getElementById(
            "messageInput"
        )
        .focus();

}


function openDiscussion() {

    openAiPanel(
        "discussion"
    );

}


function openActions() {

    openAiPanel(
        "actions"
    );

}


function closeAiPanel() {

    document
        .getElementById(
            "aiPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   DISCUSSION
========================================================= */

function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    input.value = "";


    /*
        ACTION

        AUCUNE IA.

        On ajoute uniquement
        l'ordre à la liste.
    */

    if (
        panelMode === "actions"
    ) {

        pendingActions.push(
            text
        );


        renderActions();


        return;

    }


    /*
        DISCUSSION

        Ici l'IA pourra être appelée
        immédiatement.
    */

    addUserMessage(
        text
    );


    /*
        PLACEHOLDER IA.

        À remplacer par la vraie API.
    */

    addAiMessage(
        "Réponse IA à connecter. Cette discussion ne modifie pas l'état du monde."
    );

}


/* =========================================================

========================================================= */

function addUserMessage(
    text
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =

    message.textContent =
        text;


    document
        .getElementById(
            "messages"
        )
        .appendChild(
            message
        );


    scrollMessages();

}


function addAiMessage(
    text
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message ai";


    message.textContent =
        text;


    document
        .getElementById(
            "messages"
        )
        .appendChild(
            message
        );


    scrollMessages();

}


function scrollMessages() {

    const messages =
        document.getElementById(

/* =========================================================
   ACTIONS
========================================================= */

function renderActions() {

    const container =
        document.getElementById(
            "actionsList"
        );


    container.innerHTML = "";


    if (
        pendingActions.length === 0
    ) {

        container.innerHTML = `

            <div class="emptyActions">

                Aucune action en attente.

                <br>
                <br>

                Écrivez une action ci-dessous.

                <br>
                <br>

                Elle sera enregistrée ici,
                mais ne sera envoyée à l'IA
                qu'au prochain passage du temps.

            </div>

        `;


        return;

    }


    pendingActions.forEach(
        (action, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "actionItem";


            item.innerHTML = `

                <span class="actionNumber">

                    ${index + 1}.

                </span>

                ${escapeHtml(action)}

                <span class="actionPending">

                    ⏳ En attente

                </span>

            `;


            container.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   TEMPS
========================================================= */

function toggleTimeMenu() {

    document
        .getElementById(
            "timeMenu"
        )
        .classList.toggle(
            "open"
        );

}


function closeTimeMenu() {

    document
        .getElementById(
            "timeMenu"

/*
    C'EST LE POINT DE DÉCLENCHEMENT
    DE LA FUTURE SIMULATION IA.

    Les actions sont récupérées ici,
    et PAS avant.
*/

function advanceTime(
    amount,
    unit
) {

    closeTimeMenu();


    /*
        Copie des actions.

        On ne modifie pas encore
        directement la liste.
    */

    const actionsToSimulate =
        [
            ...pendingActions
        ];


    /*
        Date avant simulation.
    */

    const oldDate =
        new Date(
            currentDate
        );


    /*
        Pour le prototype,
        nous avançons localement
        la date.

        Plus tard cette date sera
        fournie par le résultat de l'IA.
    */

    applyTimeToDate(
        currentDate,
        amount,
        unit
    );


    updateDateDisplay();


    /*
        Construction de la requête
        que nous enverrons plus tard
        à l'IA.
    */

    const simulationRequest = {

        dateStart:
            oldDate.toISOString(),

        dateEnd:
            currentDate.toISOString(),

        duration: {

            amount:
                amount,

            unit:
                unit

        },


        playerCountry:
            selectedCountry,


        pendingActions:
            actionsToSimulate,


        worldState:
            worldState

    };


    console.log(
        "================================"
    );


    console.log(
        "SIMULATION IA"
    );


    console.log(
        simulationRequest
    );


    console.log(
        "================================"
    );


    /*
        Les actions ont maintenant
        été consommées.

        Dans la vraie version,
        on attendra d'abord le résultat
        de l'IA avant de les retirer.
    */

    pendingActions = [];


    /*
        Prototype visuel.
    */

    openActions();


    const resultText =
        actionsToSimulate.length > 0

            ?

            "⏩ Temps avancé.\n\n" +

            actionsToSimulate.length +
            " action(s) sont prêtes à être simulées par l'IA."

            :

            "⏩ Temps avancé.\n\n" +

            "Aucune action n'était en attente.";


    document
        .getElementById(
            "actionsList"
        )
        .innerHTML = `

            <div class="emptyActions">

                ${escapeHtml(
                    resultText
                )}

                <br>
                <br>

                <span style="
                    color:#536b91;
                ">

                    Simulation IA à connecter.

                </span>

            </div>

        `;


    /*
        IMPORTANT POUR LA SUITE :

        L'IA devra recevoir :

        - l'état précédent
        - la date de départ
        - la durée
        - les actions du joueur

        ET SIMULER AUSSI :

        - les événements normaux
        - les autres pays
        - l'économie
        - les guerres
        - la diplomatie
        - les changements politiques
        - les conséquences des actions

        pendant toute la durée.
    */

}


/* =========================================================
   DATE
========================================================= */

function applyTimeToDate(
    date,
    amount,
    unit
) {

    if (
        unit === "days"
    ) {

        date.setDate(
            date.getDate() +
            amount
        );

    }


    else if (
        unit === "weeks"
    ) {

        date.setDate(
            date.getDate() +
            amount * 7
        );

    }


    else if (
        unit === "months"
    ) {

        date.setMonth(
            date.getMonth() +
            amount
        );

    }


    else if (
        unit === "years"
    ) {

        date.setFullYear(
            date.getFullYear() +
            amount
        );

    }

}


function updateDateDisplay() {

    const display =
        document.getElementById(
            "dateDisplay"
        );


    display.textContent =
        currentDate.toLocaleDateString(
            "fr-FR",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

}


/* =========================================================
   CUSTOM TIME
========================================================= */

function openCustomTime() {

    closeTimeMenu();


    document
        .getElementById(
            "customOverlay"
        )
        .classList.add(
            "open"
        );

}


function closeCustomTime() {

    document
        .getElementById(
            "customOverlay"
        )
        .classList.remove(
            "open"
        );

}


function confirmCustomTime() {

    const amount =
        parseInt(
            document
                .getElementById(
                    "customAmount"
                )
                .value,
            10
        );


    const unit =
        document
            .getElementById(
                "customUnit"
            )
            .value;


    if (
        !amount ||
        amount < 1
    ) {

        return;

    }


    closeCustomTime();


    advanceTime(
        amount,
        unit
    );

}


/* =========================================================
   UTILITAIRE
========================================================= */

function escapeHtml(
    text
) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        text;


    return element.innerHTML;

}


/* =========================================================
   ANNEXION — PRÉPARATION
========================================================= */


/*
    Cette fonction n'est pas encore appelée
    par l'interface.

    Elle montre cependant comment le système
    d'annexion fonctionnera.

    Exemple :

        annexTerritory(
            "Belgium",
            "France"
        );

    donnera :

        Belgique.owner = France

    et la Belgique prendra automatiquement
    la couleur française.
*/


function annexTerritory(
    territoryName,
    newOwner
) {

    const territory =
        territories.find(
            t =>
                t.name ===
                territoryName
        );


    if (!territory) {

        console.warn(
            "Territoire introuvable :",
            territoryName
        );

        return;

    }


    /*
        Modification politique.
    */

    territory.owner =
        newOwner;


    worldState[
        territoryName
    ].owner =
        newOwner;


    /*
        Mise à jour de la couleur.
    */

    mapGroup
        .selectAll(".country")
        .filter(
            d =>
                d.name ===
                territoryName
        )
        .attr(
            "fill",
            d =>
                getCountryColor(
                    d.owner
                )
        );


    /*
        Mise à jour du nom.

        Pour l'instant le nom géographique
        reste affiché.

        Plus tard on pourra afficher le nom
        du pays propriétaire ou fusionner
        réellement les frontières.
    */

    console.log(
        territoryName +
        " est maintenant contrôlé par " +
        newOwner
    );

}
