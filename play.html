<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="./css/pamplemouche.css">
    <style>
        /* Overlay de sélection non-bloquant pour la carte */
        #startOverlay {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: min(380px, calc(100vw - 32px));
            pointer-events: auto;
        }

        #startOverlay.hidden {
            display: none !important;
        }

        #startCard {
            text-align: center;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border, #292929);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
        }

        .startHelp {
            color: var(--muted, #929292);
            font-size: 13px;
            margin: 8px 0 14px;
        }

        #selectedCountryDisplay {
            padding: 10px;
            background: var(--surface2, #171717);
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 14px;
            color: var(--yellow, #ffc832);
            font-size: 14px;
        }

        .startButtons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .startButtons button {
            width: 100%;
        }

        .country {
            cursor: pointer;
            pointer-events: all;
        }
    </style>
</head>

<body class="gameBody">

<div id="game">

    <!-- =================================================
         CARTE
    ================================================== -->
    <div id="map">
        <svg id="worldMap"></svg>
    </div>

    <!-- =================================================
         DATE
    ================================================== -->
    <div id="dateDisplay">
        1 janvier 1936
    </div>

    <!-- =================================================
         HEADER
    ================================================== -->
    <header class="gameHeader">
        <a href="/games.html" class="gameBrand">
            PAMPLEMOUCHE HISTORY
        </a>
        <div id="gameAccount"></div>
    </header>

    <!-- =================================================
         PANNEAU IA
    ================================================== -->
    <div id="aiPanel">
        <div id="aiHeader">
            <div id="aiTitle">Discussion</div>
            <button id="closeAi">×</button>
        </div>

        <div id="messages"></div>
        <div id="actionsList"></div>

        <div id="inputArea">
            <input id="messageInput" type="text" autocomplete="off" placeholder="Écrivez un message...">
            <button id="sendButton">↑</button>
        </div>
    </div>

    <!-- =================================================
         INFOS PAYS
    ================================================== -->
    <div id="countryPanel">
        <div id="countryName">Pays</div>
        <div id="countryInfo" class="countryInfo">Cliquez sur un pays.</div>
    </div>

    <!-- =================================================
         TEMPS
    ================================================== -->
    <div id="timeContainer">
        <button id="timeButton">⏱ Temps</button>

        <div id="timeMenu">
            <button class="timeOption" data-amount="1" data-unit="weeks">1 semaine</button>
            <button class="timeOption" data-amount="1" data-unit="months">1 mois</button>
            <button class="timeOption" data-amount="1" data-unit="years">1 an</button>
            <div class="timeSeparator"></div>
            <button class="timeOption" id="customTimeButton">Custom Time</button>
        </div>
    </div>

    <!-- =================================================
         BOUTONS
    ================================================== -->
    <div id="bottomControls">
        <button class="controlButton" id="actionButton">⚔ Action</button>
        <button class="controlButton" id="discussionButton">💬 Discussion</button>
    </div>

    <!-- =================================================
         CARTE FLOTTANTE DE SÉLECTION DU PAYS INITIAL
    ================================================== -->
    <div id="startOverlay">
        <div id="startCard">
            <div class="modalTitle">Nouvelle Partie</div>
            <p class="startHelp">
                Cliquez sur n'importe quel pays sur la carte pour le choisir.
            </p>
            <div id="selectedCountryDisplay">
                Aucun pays sélectionné
            </div>
            <div class="startButtons">
                <button class="button primary" id="startGameBtn" disabled>
                    Commencer la partie
                </button>
                <button class="button secondary" id="loadGameBtn" style="display: none;">
                    Charger la partie existante
                </button>
            </div>
        </div>
    </div>

    <!-- =================================================
         CUSTOM TIME
    ================================================== -->
    <div id="customOverlay">
        <div id="customBox">
            <div class="modalTitle">Temps personnalisé</div>

            <div id="customInputs">
                <input id="customAmount" type="number" min="1" value="3">
                <select id="customUnit">
                    <option value="days">jours</option>
                    <option value="weeks">semaines</option>
                    <option value="months">mois</option>
                    <option value="years">années</option>
                </select>
            </div>

            <div class="modalButtons">
                <button class="button secondary" id="cancelCustom">Annuler</button>
                <button class="button primary" id="confirmCustom">Continuer</button>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="./js/auth.js"></script>
<script src="./js/play.js"></script>

</body>
</html>
