<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pamplemouche History - Play</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #080b10;
    color: #e8edf5;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
}

/* =========================
   CARTE
========================= */

#map {
    position: absolute;
    inset: 0;
    background: #080b10;
}

#map svg {
    width: 100%;
    height: 100%;
}

.country {
    fill: #202833;
    stroke: #394452;
    stroke-width: 0.6;
    transition: fill 0.15s ease;
}

.country:hover {
    fill: #344152;
    cursor: pointer;
}

.country.selected {
    fill: #536b91;
    stroke: #a9c4ef;
    stroke-width: 1.2;
}

/* =========================
   BOUTONS PRINCIPAUX
========================= */

#bottomControls {
    position: absolute;
    left: 18px;
    bottom: 18px;

    display: flex;
    gap: 8px;

    z-index: 20;
}

.controlButton {
    border: 1px solid #394452;
    background: rgba(15, 19, 26, 0.92);
    color: #e8edf5;

    padding: 10px 14px;
    border-radius: 9px;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.controlButton:hover {
    background: rgba(30, 38, 50, 0.96);
    border-color: #59677a;
}

/* =========================
   TEMPS
========================= */

#timeContainer {
    position: absolute;
    top: 18px;
    right: 18px;

    z-index: 30;
}

#timeButton {
    border: 1px solid #394452;
    background: rgba(15, 19, 26, 0.92);
    color: #e8edf5;

    padding: 10px 14px;
    border-radius: 9px;

    cursor: pointer;
    font-size: 14px;

    backdrop-filter: blur(10px);
}

#timeButton:hover {
    background: rgba(30, 38, 50, 0.96);
}

#timeMenu {
    position: absolute;

    top: calc(100% + 7px);
    right: 0;

    width: 170px;

    padding: 6px;

    border: 1px solid #394452;
    border-radius: 9px;

    background: rgba(13, 17, 23, 0.98);

    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);

    display: none;
}

#timeMenu.open {
    display: block;
}

.timeOption {
    width: 100%;

    border: none;
    background: transparent;

    color: #dce3ed;

    text-align: left;

    padding: 9px 10px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;
}

.timeOption:hover {
    background: #202936;
}

.timeSeparator {
    height: 1px;
    background: #2c3542;
    margin: 5px 0;
}

/* =========================
   MINI FENÊTRE IA
========================= */

#aiPanel {
    position: absolute;

    left: 18px;
    top: 18px;

    width: min(390px, calc(100vw - 36px));
    height: min(500px, calc(100vh - 36px));

    display: none;
    flex-direction: column;

    background: rgba(12, 16, 22, 0.97);

    border: 1px solid #394452;
    border-radius: 11px;

    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);

    backdrop-filter: blur(14px);

    z-index: 50;

    overflow: hidden;
}

#aiPanel.open {
    display: flex;
}

/* HEADER */

#aiHeader {
    height: 43px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #151b24;

    border-bottom: 1px solid #2b3441;
}

#aiTitle {
    font-size: 13px;
    font-weight: 600;
}

#closeAi {
    border: none;
    background: transparent;

    color: #8e9bab;

    font-size: 20px;

    cursor: pointer;

    line-height: 1;
}

#closeAi:hover {
    color: white;
}

/* MESSAGES */

#messages {
    flex: 1;

    overflow-y: auto;

    padding: 12px;
}

.message {
    max-width: 88%;

    padding: 8px 10px;

    margin-bottom: 8px;

    border-radius: 8px;

    font-size: 13px;
    line-height: 1.45;

    white-space: pre-wrap;
}

.message.ai {
    background: #1b2430;
    color: #dce6f3;
}

.message.user {
    margin-left: auto;

    background: #31598c;
    color: white;
}

/* =========================
   ACTIONS
========================= */

#actionsList {
    display: none;
}

.actionItem {
    position: relative;

    padding: 10px;

    margin-bottom: 7px;

    background: #151c25;

    border: 1px solid #293341;

    border-radius: 8px;

    font-size: 13px;
}

.actionNumber {
    color: #91a8c7;
    margin-right: 5px;
}

.actionPending {
    display: block;

    margin-top: 5px;

    color: #6f7d8e;

    font-size: 11px;
}

.emptyActions {
    color: #687687;

    font-size: 13px;

    line-height: 1.5;

    padding: 5px;
}

/* =========================
   INPUT
========================= */

#inputArea {
    display: flex;

    gap: 7px;

    padding: 8px;

    background: #10151d;

    border-top: 1px solid #2b3441;
}

#messageInput {
    flex: 1;

    min-width: 0;

    border: 1px solid #323d4b;

    border-radius: 7px;

    padding: 9px 10px;

    outline: none;

    background: #090d12;

    color: white;

    font-family: inherit;

    font-size: 13px;
}

#messageInput:focus {
    border-color: #536b91;
}

#sendButton {
    width: 40px;

    border: none;

    border-radius: 7px;

    background: #31598c;

    color: white;

    cursor: pointer;

    font-size: 15px;
}

#sendButton:hover {
    background: #3c6ba5;
}

/* =========================
   PAYS
========================= */

#countryPanel {
    position: absolute;

    right: 18px;
    bottom: 18px;

    width: 235px;

    padding: 13px;

    background: rgba(13, 18, 25, 0.92);

    border: 1px solid #303b49;

    border-radius: 10px;

    display: none;

    z-index: 15;

    backdrop-filter: blur(10px);
}

#countryPanel.visible {
    display: block;
}

#countryName {
    font-size: 15px;
    font-weight: 600;

    margin-bottom: 9px;
}

.countryInfo {
    font-size: 12px;
    color: #8795a7;

    margin-top: 5px;
}

/* =========================
   CUSTOM TIME
========================= */

#customOverlay {
    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.35);

    z-index: 100;
}

#customOverlay.open {
    display: flex;
}

#customBox {
    width: min(340px, calc(100vw - 36px));

    background: #121821;

    border: 1px solid #394452;

    border-radius: 11px;

    padding: 16px;

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

#customTitle {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 14px;
}

#customInputs {
    display: flex;
    gap: 8px;
}

#customAmount,
#customUnit {
    flex: 1;

    min-width: 0;

    padding: 9px;

    border: 1px solid #354151;

    border-radius: 7px;

    background: #090d12;

    color: white;

    outline: none;
}

#customButtons {
    display: flex;

    justify-content: flex-end;

    gap: 7px;

    margin-top: 14px;
}

.customButton {
    border: 1px solid #394452;

    background: #1a222d;

    color: #e2e8f0;

    padding: 8px 12px;

    border-radius: 7px;

    cursor: pointer;
}

.customButton.primary {
    background: #31598c;
    border-color: #31598c;
}
</style>
</head>

<body>

<div id="game">

    <!-- =====================
         CARTE
    ====================== -->

    <div id="map">
        <svg id="worldMap"></svg>
    </div>


    <!-- =====================
         TEMPS
    ====================== -->

    <div id="timeContainer">

        <button id="timeButton">
            ⏱ Temps
        </button>

        <div id="timeMenu">

            <button class="timeOption"
                    onclick="advanceTime(7, 'days')">
                1 semaine
            </button>

            <button class="timeOption"
                    onclick="advanceTime(1, 'months')">
                1 mois
            </button>

            <button class="timeOption"
                    onclick="advanceTime(1, 'years')">
                1 an
            </button>

            <div class="timeSeparator"></div>

            <button class="timeOption"
                    onclick="openCustomTime()">
                Custom Time
            </button>

        </div>

    </div>


    <!-- =====================
         INFORMATIONS PAYS
    ====================== -->

    <div id="countryPanel">

        <div id="countryName">
            Pays
        </div>

        <div class="countryInfo">
            Cliquez sur un pays pour voir ses informations.
        </div>

    </div>


    <!-- =====================
         PANNEAU IA
    ====================== -->

    <div id="aiPanel">

        <div id="aiHeader">

            <div id="aiTitle">
                💬 Discussion
            </div>

            <button id="closeAi">
                ×
            </button>

        </div>


        <div id="messages"></div>

        <div id="actionsList"></div>


        <div id="inputArea">

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="Écrivez un message..."
            >

            <button id="sendButton">
                ➤
            </button>

        </div>

    </div>


    <!-- =====================
         BOUTONS BAS GAUCHE
    ====================== -->

    <div id="bottomControls">

        <button
            class="controlButton"
            id="actionButton">
            ⚔ Action
        </button>

        <button
            class="controlButton"
            id="discussionButton">
            💬 Discussion
        </button>

    </div>


    <!-- =====================
         CUSTOM TIME
    ====================== -->

    <div id="customOverlay">

        <div id="customBox">

            <div id="customTitle">
                ⏩ Temps personnalisé
            </div>

            <div id="customInputs">

                <input
                    id="customAmount"
                    type="number"
                    min="1"
                    value="3"
                >

                <select id="customUnit">

                    <option value="days">
                        jours
                    </option>

                    <option value="weeks">
                        semaines
                    </option>

                    <option value="months">
                        mois
                    </option>

                    <option value="years">
                        années
                    </option>

                </select>

            </div>

            <div id="customButtons">

                <button
                    class="customButton"
                    onclick="closeCustomTime()">
                    Annuler
                </button>

                <button
                    class="customButton primary"
                    onclick="confirmCustomTime()">
                    Continuer
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* ============================================================
   ÉTAT DU JEU
============================================================ */

let currentDate = new Date(1936, 0, 1);

let selectedCountry = null;

let panelMode = "discussion";

/*
    IMPORTANT :

    Les actions restent ici.

    Elles ne sont PAS envoyées à l'IA quand le joueur
    les écrit.

    Elles seront récupérées uniquement lors de
    advanceTime().
*/

let pendingActions = [];


/* ============================================================
   INITIALISATION
============================================================ */

document.addEventListener("DOMContentLoaded", () => {

    initializeMap();

    document
        .getElementById("timeButton")
        .addEventListener("click", toggleTimeMenu);

    document
        .getElementById("actionButton")
        .addEventListener("click", openActions);

    document
        .getElementById("discussionButton")
        .addEventListener("click", openDiscussion);

    document
        .getElementById("closeAi")
        .addEventListener("click", closeAiPanel);

    document
        .getElementById("sendButton")
        .addEventListener("click", sendMessage);

    document
        .getElementById("messageInput")
        .addEventListener("keydown", event => {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

    document.addEventListener("click", event => {

        const timeContainer =
            document.getElementById("timeContainer");

        if (!timeContainer.contains(event.target)) {

            document
                .getElementById("timeMenu")
                .classList.remove("open");

        }

    });

});


/* ============================================================
   CARTE
============================================================ */

function initializeMap() {

    const svg =
        d3.select("#worldMap");

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const projection =
        d3.geoMercator()
          .scale(width / 6.4)
          .translate([
              width / 2,
              height / 1.55
          ]);


    const path =
        d3.geoPath()
          .projection(projection);


    const mapGroup =
        svg.append("g");


    const zoom =
        d3.zoom()
          .scaleExtent([1, 8])
          .on("zoom", event => {

              mapGroup.attr(
                  "transform",
                  event.transform
              );

          });


    svg.call(zoom);


    d3.json(
        "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
    )
    .then(world => {

        const countries =
            topojson.feature(
                world,
                world.objects.countries
            ).features;


        mapGroup
            .selectAll(".country")
            .data(countries)
            .enter()
            .append("path")
            .attr("class", "country")
            .attr("d", path)

            .on("click", function(event, country) {

                d3.selectAll(".country")
                    .classed("selected", false);

                d3.select(this)
                    .classed("selected", true);


                selectedCountry =
                    country.properties.name ||
                    "Pays inconnu";


                showCountry(selectedCountry);

            });

    });

}


/* ============================================================
   PAYS
============================================================ */

function showCountry(name) {

    const panel =
        document.getElementById("countryPanel");

    document
        .getElementById("countryName")
        .textContent = name;


    panel.classList.add("visible");

}


/* ============================================================
   PANNEAU IA
============================================================ */

function openAiPanel(mode) {

    panelMode = mode;

    const panel =
        document.getElementById("aiPanel");

    const title =
        document.getElementById("aiTitle");

    const messages =
        document.getElementById("messages");

    const actions =
        document.getElementById("actionsList");


    panel.classList.add("open");


    if (mode === "discussion") {

        title.textContent =
            "💬 Discussion";

        messages.style.display =
            "block";

        actions.style.display =
            "none";

        document
            .getElementById("messageInput")
            .placeholder =
            "Écrivez un message...";


        if (messages.children.length === 0) {

            addAiMessage(
                "Je suis prêt. Posez-moi une question sur votre pays ou sur la situation du monde."
            );

        }

    }

    else {

        title.textContent =
            "⚔ Actions";

        messages.style.display =
            "none";

        actions.style.display =
            "block";

        document
            .getElementById("messageInput")
            .placeholder =
            "Décrivez une action...";

        renderActions();

    }


    document
        .getElementById("messageInput")
        .focus();

}


function openDiscussion() {

    openAiPanel("discussion");

}


function openActions() {

    openAiPanel("actions");

}


function closeAiPanel() {

    document
        .getElementById("aiPanel")
        .classList.remove("open");

}


/* ============================================================
   DISCUSSION
============================================================ */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";


    /*
        MODE ACTION

        Aucun appel IA.

        On ajoute simplement l'action
        dans la liste.
    */

    if (panelMode === "actions") {

        pendingActions.push(text);

        renderActions();

        return;

    }


    /*
        MODE DISCUSSION

        Ici, contrairement aux actions,
        on pourra appeler l'IA immédiatement.
    */

    addUserMessage(text);


    /*
        TODO :

        Remplacer cette réponse temporaire
        par l'appel réel à l'API IA.
    */

    addAiMessage(
        "Réponse IA à connecter. Cette discussion ne modifie pas l'état du monde."
    );

}


function addUserMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.textContent =
        text;


    document
        .getElementById("messages")
        .appendChild(message);


    scrollMessages();

}


function addAiMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.textContent =
        text;


    document
        .getElementById("messages")
        .appendChild(message);


    scrollMessages();

}


function scrollMessages() {

    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;

}


/* ============================================================
   ACTIONS
============================================================ */

function renderActions() {

    const container =
        document.getElementById("actionsList");


    container.innerHTML = "";


    if (pendingActions.length === 0) {

        container.innerHTML = `
            <div class="emptyActions">
                Aucune action en attente.<br><br>
                Écrivez une action ci-dessous.
                Elle sera enregistrée mais ne sera
                pas envoyée à l'IA avant que vous
                avanciez le temps.
            </div>
        `;

        return;

    }


    pendingActions.forEach(
        (action, index) => {

            const item =
                document.createElement("div");

            item.className =
                "actionItem";


            item.innerHTML = `
                <span class="actionNumber">
                    ${index + 1}.
                </span>

                ${escapeHtml(action)}

                <span class="actionPending">
                    ⏳ En attente
                </span>
            `;


            container.appendChild(item);

        }
    );

}


/* ============================================================
   TEMPS
============================================================ */

function toggleTimeMenu() {

    document
        .getElementById("timeMenu")
        .classList.toggle("open");

}


/*
    C'est LA fonction importante.

    Une action écrite précédemment n'appelle jamais
    l'IA.

    Quand le joueur choisit une durée :

        1. on récupère les actions
        2. on récupère l'état du monde
        3. on demande à l'IA de simuler
        4. l'IA simule la durée entière
        5. les actions du joueur sont prises en compte
        6. le monde évolue normalement autour
        7. on reçoit le nouvel état
*/

function advanceTime(amount, unit) {

    closeTimeMenu();


    const actionsToSimulate =
        [...pendingActions];


    const oldDate =
        new Date(currentDate);


    /*
        Pour l'instant, on avance réellement
        la date localement.

        Plus tard, cette date viendra du
        résultat de la simulation IA.
    */

    applyTimeToDate(
        currentDate,
        amount,
        unit
    );


    /*
        Les actions sont maintenant consommées.

        IMPORTANT :

        Elles n'étaient pas envoyées lors de leur
        création.

        Elles sont envoyées maintenant, avec
        la durée demandée.
    */

    pendingActions = [];


    const simulationRequest = {

        dateStart:
            oldDate.toISOString(),

        dateEnd:
            currentDate.toISOString(),

        duration: {
            amount,
            unit
        },

        country:
            selectedCountry,

        actions:
            actionsToSimulate

    };


    console.log(
        "SIMULATION IA :",
        simulationRequest
    );


    /*
        TODO :

        C'est ici qu'on branchera l'IA.

        Exemple conceptuel :

        await simulateWorld(simulationRequest);

        L'IA devra simuler :

        - les actions du joueur
        - les conséquences de ces actions
        - les événements normaux
        - les autres pays
        - l'économie
        - la diplomatie
        - etc.

        sur toute la durée demandée.
    */


    openActions();

    const actionsMessage =
        actionsToSimulate.length
            ? actionsToSimulate.length +
              " action(s) ont été intégrées à la simulation."
            : "Aucune action n'était en attente.";


    document.getElementById("actionsList").innerHTML = `
        <div class="emptyActions">
            ⏩ Temps avancé.<br><br>
            ${actionsMessage}
            <br><br>
            <span style="color:#536b91">
                La simulation IA sera branchée ici.
            </span>
        </div>
    `;

}


function applyTimeToDate(
    date,
    amount,
    unit
) {

    if (unit === "days") {

        date.setDate(
            date.getDate() + amount
        );

    }

    else if (unit === "weeks") {

        date.setDate(
            date.getDate() + amount * 7
        );

    }

    else if (unit === "months") {

        date.setMonth(
            date.getMonth() + amount
        );

    }

    else if (unit === "years") {

        date.setFullYear(
            date.getFullYear() + amount
        );

    }

}


/* ============================================================
   CUSTOM TIME
============================================================ */

function openCustomTime() {

    closeTimeMenu();

    document
        .getElementById("customOverlay")
        .classList.add("open");

}


function closeCustomTime() {

    document
        .getElementById("customOverlay")
        .classList.remove("open");

}


function confirmCustomTime() {

    const amount =
        parseInt(
            document.getElementById("customAmount").value,
            10
        );


    const unit =
        document.getElementById("customUnit").value;


    if (!amount || amount < 1) {
        return;
    }


    closeCustomTime();


    advanceTime(
        amount,
        unit
    );

}


/* ============================================================
   UTILITAIRE
============================================================ */

function closeTimeMenu() {

    document
        .getElementById("timeMenu")
        .classList.remove("open");

}


function escapeHtml(text) {

    const element =
        document.createElement("div");

    element.textContent =
        text;

    return element.innerHTML;

}

</script>

</body>
</html>
