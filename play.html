<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pamplemouche History - Partie en cours</title>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #06080c;
      color: #e2e8f0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================ */
    /* 1. HEADER & BARRE DE TEMPS                                  */
    /* ============================================================ */
    .game-header {
      height: 52px;
      background-color: #0b0e14;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.2rem;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      background: #e2e8f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0e14;
      font-weight: bold;
      font-size: 0.85rem;
    }

    /* Commandes de temps / Vitesse */
    .time-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #111622;
      border: 1px solid #2d3748;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
    }

    .time-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .time-btn:hover, .time-btn.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .date-display {
      font-weight: 700;
      font-size: 0.9rem;
      color: #f8fafc;
      margin-left: 0.5rem;
      border-left: 1px solid #334155;
      padding-left: 0.75rem;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .coins-badge {
      background: #161b26;
      border: 1px solid #2d3748;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border: 2px solid #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #ffffff;
      cursor: pointer;
    }

    .user-avatar.guest {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      border: 2px solid #475569;
      color: #94a3b8;
    }

    /* ============================================================ */
    /* 2. DISPOSITION PRINCIPALE (MAP + PANNEAUX)                  */
    /* ============================================================ */
    .game-body {
      flex: 1;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    /* Carte SVG */
    .map-container {
      flex: 1;
      height: 100%;
      background-color: #06090e;
      cursor: grab;
      position: relative;
    }

    .map-container:active { cursor: grabbing; }

    svg { width: 100%; height: 100%; }

    .country {
      fill: #1a2232;
      stroke: #2e3b52;
      stroke-width: 0.6px;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }

    .country:hover {
      fill: #2563eb;
      stroke: #60a5fa;
      cursor: pointer;
    }

    .country.selected {
      fill: #7c3aed;
      stroke: #a78bfa;
      stroke-width: 1.2px;
    }

    /* Tooltip Carte */
    .map-tooltip {
      position: absolute;
      padding: 0.4rem 0.7rem;
      background: rgba(11, 15, 23, 0.92);
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 0.8rem;
      pointer-events: none;
      display: none;
      backdrop-filter: blur(6px);
      z-index: 50;
    }

    /* ============================================================ */
    /* 3. PANNEAU LATÉRAL GAUCHE (NATION / STATS)                  */
    /* ============================================================ */
    .side-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 330px;
      max-height: calc(100% - 90px);
      background: rgba(15, 20, 29, 0.92);
      border: 1px solid #273549;
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow: hidden;
    }

    .panel-header {
      padding: 1rem;
      background: rgba(22, 30, 44, 0.6);
      border-bottom: 1px solid #273549;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .flag-icon {
      font-size: 1.8rem;
    }

    .nation-details h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .nation-details p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Onglets du Panneau */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid #273549;
      background: #0f141d;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .panel-content {
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      font-size: 0.85rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .stat-label { color: #94a3b8; }
    .stat-value { font-weight: 600; color: #f1f5f9; }

    /* ============================================================ */
    /* 4. CHAT IA & EVENT LOG (BAS GAUCHE)                         */
    /* ============================================================ */
    .ai-console {
      position: absolute;
      bottom: 20px;
      left: 15px;
      width: 420px;
      background: rgba(13, 17, 25, 0.94);
      border: 1px solid #273549;
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow: hidden;
    }

    .console-header {
      padding: 0.6rem 1rem;
      background: #161e2e;
      border-bottom: 1px solid #273549;
      font-size: 0.8rem;
      font-weight: 700;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .console-logs {
      height: 110px;
      padding: 0.75rem;
      overflow-y: auto;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: #cbd5e1;
    }

    .log-entry {
      line-height: 1.3;
    }

    .log-entry span.author {
      font-weight: 700;
      color: #38bdf8;
    }

    .console-input-box {
      display: flex;
      padding: 0.5rem;
      background: #0f141d;
      border-top: 1px solid #273549;
    }

    .console-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
      outline: none;
    }

    .console-input-box button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ============================================================ */
    /* 5. BARRE D'ACTION BASSE (TIMELINE HUD)                      */
    /* ============================================================ */
    .bottom-hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 20, 29, 0.92);
      border: 1px solid #273549;
      backdrop-filter: blur(12px);
      padding: 0.7rem 1.4rem;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      z-index: 20;
    }

    .btn-next-turn {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      transition: all 0.2s;
    }

    .btn-next-turn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body>

  <header class="game-header">
    <div class="brand" onclick="window.location.href='games.html'">
      <div class="brand-logo">P</div>
      <span>Pamplemouche History</span>
    </div>

    <div class="time-controls">
      <button class="time-btn" onclick="togglePause()">⏸</button>
      <button class="time-btn active" onclick="setSpeed(1)">1x</button>
      <button class="time-btn" onclick="setSpeed(2)">2x</button>
      <button class="time-btn" onclick="setSpeed(5)">5x</button>
      <span class="date-display" id="gameDate">1 Janv. 1936</span>
    </div>

    <div class="user-actions">
      <div class="coins-badge">
        🍊 <span id="user-pamp-balance">0 PAMP</span>
      </div>
      <div class="user-avatar" id="userAvatar">?</div>
    </div>
  </header>

  <div class="game-body">
    
    <div class="map-container">
      <div class="map-tooltip" id="mapTooltip"></div>
      <svg id="worldMap"></svg>
    </div>

    <div class="side-panel">
      <div class="panel-header">
        <span class="flag-icon" id="nationFlag">🏳️</span>
        <div class="nation-details">
          <h2 id="nationName">Sélectionnez un pays</h2>
          <p id="nationRegime">Régime Politique : Incertain</p>
        </div>
      </div>

      <div class="panel-tabs">
        <button class="tab-btn active">Aperçu</button>
        <button class="tab-btn">Économie</button>
        <button class="tab-btn">Armée</button>
        <button class="tab-btn">Diplomatie</button>
      </div>

      <div class="panel-content">
        <div class="stat-row">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="statPop">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Stabilité</span>
          <span class="stat-value" id="statStability">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Usines / Industrie</span>
          <span class="stat-value" id="statIndustry">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Division Militaire</span>
          <span class="stat-value" id="statArmy">-</span>
        </div>
      </div>
    </div>

    <div class="ai-console">
      <div class="console-header">
        <span>🤖</span> Assistant Stratégique Pax IA
      </div>
      <div class="console-logs" id="consoleLogs">
        <div class="log-entry"><span class="author">Système:</span> Partie initialisée. Sélectionnez un territoire pour débuter.</div>
      </div>
      <div class="console-input-box">
        <input type="text" id="aiInput" placeholder="Saisir un ordre ou poser une question à l'IA..." onkeypress="if(event.key==='Enter') envoyerOrdreIA()">
        <button onclick="envoyerOrdreIA()">Envoyer</button>
      </div>
    </div>

    <div class="bottom-hud">
      <div style="font-size: 0.85rem; color: #94a3b8;">
        Tour actuel : <strong style="color:#f8fafc;" id="turnCounter">1</strong>
      </div>
      <button class="btn-next-turn" onclick="passerTour()">Fin du tour ➔</button>
    </div>

  </div>

  <script>
    let currentTurn = 1;
    let selectedCountryElement = null;

    document.addEventListener("DOMContentLoaded", () => {
      chargerInfosUtilisateur();
      initMap();
    });

    function chargerInfosUtilisateur() {
      const connectedUser = JSON.parse(localStorage.getItem('pamplemouche_user'));
      const guestUser = JSON.parse(localStorage.getItem('guest_user'));
      const pampDisplay = document.getElementById('user-pamp-balance');
      const avatarDisplay = document.getElementById('userAvatar');

      if (connectedUser && !connectedUser.isGuest) {
        pampDisplay.textContent = `${connectedUser.pampBalance} PAMP`;
        avatarDisplay.textContent = connectedUser.username.charAt(0).toUpperCase();
        avatarDisplay.classList.remove('guest');
      } else {
        const balance = guestUser ? guestUser.pampBalance || 0 : 0;
        pampDisplay.textContent = `${balance} PAMP`;
        avatarDisplay.textContent = "🕵️";
        avatarDisplay.classList.add('guest');
      }
    }

    function initMap() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      const svg = d3.select("#worldMap");
      const g = svg.append("g");

      const projection = d3.geoMercator()
        .scale(width / 6.5)
        .translate([width / 2, height / 1.5]);

      const path = d3.geoPath().projection(projection);

      const zoom = d3.zoom()
        .scaleExtent([1, 10])
        .on("zoom", (event) => g.attr("transform", event.transform));

      svg.call(zoom);

      const tooltip = d3.select("#mapTooltip");

      d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
        const countries = topojson.feature(data, data.objects.countries).features;

        g.selectAll("path")
          .data(countries)
          .enter()
          .append("path")
          .attr("class", "country")
          .attr("d", path)
          .on("mouseover", function(event, d) {
            tooltip.style("display", "block")
                   .html(`<strong>${d.properties.name || "Territoire"}</strong>`);
          })
          .on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 12) + "px")
                   .style("top", (event.pageY + 12) + "px");
          })
          .on("mouseout", function() {
            tooltip.style("display", "none");
          })
          .on("click", function(event, d) {
            if (selectedCountryElement) {
              d3.select(selectedCountryElement).classed("selected", false);
            }
            selectedCountryElement = this;
            d3.select(this).classed("selected", true);

            mettreAJourPanneau(d.properties.name || "Nation Inconnue");
          });
      });
    }

    function mettreAJourPanneau(nomNation) {
      document.getElementById("nationName").textContent = nomNation;
      document.getElementById("nationFlag").textContent = "🚩";
      document.getElementById("nationRegime").textContent = "Régime : Démocratie / République";
      document.getElementById("statPop").textContent = (Math.floor(Math.random() * 50) + 10) + " M";
      document.getElementById("statStability").textContent = (Math.floor(Math.random() * 40) + 60) + "%";
      document.getElementById("statIndustry").textContent = Math.floor(Math.random() * 120) + 20;
      document.getElementById("statArmy").textContent = Math.floor(Math.random() * 40) + 5 + " Divisions";

      ajouterLog("IA", `Analyse stratégique de : ${nomNation}`);
    }

    function envoyerOrdreIA() {
      const input = document.getElementById("aiInput");
      const texte = input.value.trim();
      if (!texte) return;

      ajouterLog("Joueur", texte);
      input.value = "";

      // Simulation de réponse IA
      setTimeout(() => {
        ajouterLog("IA", "Ordre pris en compte. Calcul des conséquences géopolitiques...");
      }, 600);
    }

    function ajouterLog(auteur, message) {
      const logs = document.getElementById("consoleLogs");
      const div = document.createElement("div");
      div.className = "log-entry";
      div.innerHTML = `<span class="author">${auteur}:</span> ${message}`;
      logs.appendChild(div);
      logs.scrollTop = logs.scrollHeight;
    }

    function passerTour() {
      currentTurn++;
      document.getElementById("turnCounter").textContent = currentTurn;
      ajouterLog("Système", `Passage au Tour ${currentTurn}`);
    }

    function togglePause() {}
    function setSpeed(vitesse) {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
